# CI: build, test, and lint (push main / all PR bases / merge_group / manual).
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# Phase A1: least-privilege top-level permissions (checkout + cache only need read).
permissions:
  contents: read

# Phase 1: cancel same-ref pile-up (rapid pushes / PR syncs).
# push is main-only so feature commits run once via pull_request (no push+PR double).
# cancel-in-progress is false for ref refs/heads/main only (direct push or workflow_dispatch on main;
# protects running only, pending in same group is still replaced by newer run).
# PR merge refs (refs/pull/N/merge) and other branches still cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  locale-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out the repository.
      - uses: actions/checkout@v4
      # Provision JDK 17 required by AGP 8.x and Kotlin 2.x.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Provision Gradle: the pinned 8.7 wrapper (./gradlew + gradle-wrapper.jar)
      # fixes the version, so runner preinstalled updates cannot change it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      # Validate all workflow YAML files with python (stdlib + PyYAML fallback).
      - name: YAML syntax check (python)
        run: |
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
              has_yaml = True
          except ImportError:
              has_yaml = False
              print("PyYAML not available, falling back to basic parse check")
          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          if not files:
              print("no workflow yaml files found")
              sys.exit(0)
          ok = True
          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      text = fh.read()
                  if has_yaml:
                      yaml.safe_load(text)
                  else:
                      assert text.strip(), f"empty file: {f}"
                  print(f"OK: {f}")
              except Exception as e:
                  print(f"FAIL: {f}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
      # Compile all modules (app APK + hook/core AARs). No swallow-echo fallback here:
      # any compilation failure must propagate a nonzero exit code and fail the job.
      # Phase A2: wrapper is committed, so always use ./gradlew (pinned Gradle 8.7).
      - name: Assemble app, hook, core (debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :hook:assembleDebug :core:assembleDebug --no-daemon
      # B2: verify ShizukuProvider survives into the built DEX (guards provider dep regressions).
      # Uses only shell/unzip/grep (runner built-ins); no apkanalyzer to avoid missing SDK components.
      - name: APK ShizukuProvider DEX check
        run: |
          set -e
          echo "== (a) manifest declares rikka.shizuku.ShizukuProvider =="
          grep -F "rikka.shizuku.ShizukuProvider" app/src/main/AndroidManifest.xml
          echo "== (b) DEX contains ShizukuProvider =="
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "FAIL: $APK not found; run :app:assembleDebug first"
            exit 1
          fi
          FOUND=0
          for dex in $(unzip -l "$APK" | grep -o 'classes[0-9]*\.dex'); do
            echo "--- scanning $dex ---"
            if unzip -p "$APK" "$dex" | grep -q "ShizukuProvider"; then
              echo "FOUND ShizukuProvider in $dex"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "FAIL: ShizukuProvider class string not found in $APK"
            exit 1
          fi
          echo "PASS: ShizukuProvider present in manifest and DEX"
      # D1: verify the hook entry survives into the single APK (guards packaging regressions).
      # Uses only shell/unzip/grep (runner built-ins); no apkanalyzer to avoid missing SDK components.
      - name: APK hook entry check
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "FAIL: $APK not found; run :app:assembleDebug first"
            exit 1
          fi
          echo "== (a) META-INF/xposed resources present in APK =="
          for entry in META-INF/xposed/java_init.list META-INF/xposed/module.prop META-INF/xposed/scope.list; do
            if unzip -l "$APK" | grep -Fq "$entry"; then
              echo "FOUND $entry"
            else
              echo "FAIL: $entry missing in $APK"
              exit 1
            fi
          done
          echo "== (b) java_init.list points at DualHook =="
          if unzip -p "$APK" META-INF/xposed/java_init.list | grep -Fq "com.galaxydual.hook.DualHook"; then
            echo "FOUND DualHook entry in java_init.list"
          else
            echo "FAIL: DualHook entry missing in META-INF/xposed/java_init.list"
            exit 1
          fi
          echo "== (c) DEX contains DualHook =="
          FOUND=0
          for dex in $(unzip -l "$APK" | grep -o 'classes[0-9]*\.dex'); do
            echo "--- scanning $dex ---"
            if unzip -p "$APK" "$dex" | grep -q "DualHook"; then
              echo "FOUND DualHook in $dex"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "FAIL: DualHook class string not found in $APK"
            exit 1
          fi
          echo "PASS: hook entry (DualHook + xposed resources) present in APK"
      # H1 scope parity: scope.list <-> HookScopes/DualHook <-> manifest.
      # Single source of truth is HookScopes.kt; DualHook companions delegate.
      - name: Scope parity (hook scopes)
        run: |
          set -e
          echo "== scope.list =="
          cat hook/src/main/resources/META-INF/xposed/scope.list
          echo "== HookScopes (single source of truth) =="
          grep -F "SYSTEM_SCOPE = " hook/src/main/java/com/galaxydual/hook/HookScopes.kt
          grep -F "DA_AGENT_PACKAGE = " hook/src/main/java/com/galaxydual/hook/HookScopes.kt
          grep -F "SUPPORTED_SCOPES" -A 5 hook/src/main/java/com/galaxydual/hook/HookScopes.kt
          echo "== DualHook delegation =="
          grep -F "SYSTEM_SCOPE = HookScopes.SYSTEM_SCOPE" hook/src/main/java/com/galaxydual/hook/DualHook.kt
          grep -F "DA_AGENT_PACKAGE = HookScopes.DA_AGENT_PACKAGE" hook/src/main/java/com/galaxydual/hook/DualHook.kt
          grep -F "SUPPORTED_SCOPES" hook/src/main/java/com/galaxydual/hook/DualHook.kt | grep -F "= HookScopes.SUPPORTED_SCOPES"
          echo "== manifest xposedscope =="
          grep -F "xposedscope" hook/src/main/AndroidManifest.xml
          # scope.list must be exactly the two recommended scopes, in order.
          printf 'system\ncom.samsung.android.da.daagent\n' > /tmp/expected_scope.list
          diff -u /tmp/expected_scope.list hook/src/main/resources/META-INF/xposed/scope.list
          # Manifest must carry the same two scopes (semicolon-joined).
          grep -F 'android:value="system;com.samsung.android.da.daagent"' hook/src/main/AndroidManifest.xml
          # module.prop fail-safe marker + version sync with app versionName.
          grep -F 'exceptionMode=protective' hook/src/main/resources/META-INF/xposed/module.prop
          APP_VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1 | tr -d ' \r')
          MOD_VER=$(grep -oP '^version=\K.*' hook/src/main/resources/META-INF/xposed/module.prop | head -n 1 | tr -d ' \r')
          echo "app versionName=$APP_VER module.prop version=$MOD_VER"
          test "$APP_VER" = "$MOD_VER"
          echo "PASS: scope parity + module fail-safe + version sync"
      # H1 honesty gate: unverified features must never be claimed as working.
      - name: Honesty gate (no unverified claims)
        run: |
          set -e
          echo "== forbid claiming unverified dual support as done =="
          # Banned phrases in code/docs (DEVICE-UNVERIFIED / [待實機驗證] required instead).
          # Exclude build outputs and VCS metadata for speed and to avoid binary noise.
          if grep -rn --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle --include='*.kt' --include='*.md' --include='*.xml' --include='*.kts' -E '已支援雙開|已驗證可用|穩定支援 One ?UI|實機驗證通過' . ; then
            echo "FAIL: unverified success claim found (use [待實機驗證]/DEVICE-UNVERIFIED instead)"
            exit 1
          fi
          echo "PASS: honesty gate"
      # H1 no-touch gates: Knox/Secure Folder + GPL code containment.
      # Scope is intentionally */src/main + *.kt: policy docs (docs/, README)
      # may name these projects/systems to declare them out of scope, and
      # tests may assert the gates themselves; executable sources must not.
      - name: Knox no-touch gate
        run: |
          set -e
          echo "== Knox/Secure Folder must only appear in policy docs =="
          # Scope is *.kt-only under */src/main (docs + manifest description
          # may name these systems to declare them out of scope; unit tests
          # asserting the gates themselves are excluded by-design);
          # never in hook/core/app executable sources.
          # \b is a GNU grep extension (runner is ubuntu-latest); it keeps
          # short tokens (edm/mdm/persona) from false-positive on words like
          # "declaredMethods".
          if grep -rni --include='*.kt' -E 'knox|secure_?folder|timakeystore|dualspa|enterprise_container|sec_container|container_?agent|knox_container|\bedm\b|\bmdm\b|\bpersona\b|warranty.*void.*0x1|defex|/data/knox|/mnt/knox|/data/media/0/../knox' hook/src/main app/src/main core/src/main ; then
            echo "FAIL: Knox-related reference in executable sources"
            exit 1
          fi
          echo "PASS: Knox no-touch"
      - name: GPL containment gate
        run: |
          set -e
          echo "== GPL project code must not leak into sources =="
          # Docs (CREDITS/HOOK/README) may reference idea-only projects by name;
          # executable sources must stay original MIT.
          if grep -rn --include='*.kt' -E 'DualClone|CloneCat|AppDualZuku|JingMatrix|KnoxPatch|edtweak|dual-manager|dual-apps' hook/src app/src core/src ; then
            echo "FAIL: third-party project reference in executable sources (docs only)"
            exit 1
          fi
          echo "PASS: GPL containment"
      # Run :app + :core + :hook unit tests. Failures fail the job.
      - name: Unit tests (app, core, hook debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :core:testDebugUnitTest :hook:testDebugUnitTest --no-daemon
      # Always keep test reports, even when the test step fails.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      # Phase P29 (issue #29): the build job only compiles androidTest here;
      # the full harness executes on the locale-instrumentation job above
      # (API 29 emulator) on every PR. connectedCheck in this job stays a
      # compile gate only (see locale-instrumentation job for execution).
      - name: Compile androidTest (no device needed)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebugAndroidTest --no-daemon
      - name: Upload APK artifacts (debug + androidTest)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      # NOTE: no ktlint plugin is applied in this repo (see gradle/libs.versions.toml),
      # so the old `ktlintCheck` placeholder step is replaced with the zero-dependency
      # Android Lint task built into AGP. If the `lint` task ever stops existing,
      # Gradle exits nonzero and this step fails the job (no silent fallback).
      - name: Android Lint (AGP built-in)
        run: |
          chmod +x ./gradlew
          ./gradlew lint --no-daemon
      # Always keep lint reports, even when the lint step fails.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          if-no-files-found: warn
          retention-days: 14

  # Phase P29 (issue #29): instrumentation manual profile (API 34, matches
  # compileSdk/targetSdk) runs on workflow_dispatch; the API 29 (minSdk floor)
  # profile runs on every PR via the locale-instrumentation job above.
  # Record each manual run in docs/ACCEPTANCE.md (commit / APK SHA256 /
  # operation / expected / actual / untested / redaction statement).
  instrumentation-manual:
    name: Instrumentation (manual emulator matrix)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x ./gradlew
            adb shell input keyevent 82 || true
            adb shell input keyevent 224 || true
            adb shell wm dismiss-keyguard || true
            sleep 2
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Record tested APK provenance
        if: always()
        run: |
          set -e
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -f "$APP_APK"
          test -f "$TEST_APK"
          APP_SHA=$(sha256sum "$APP_APK" | awk '{print $1}')
          TEST_SHA=$(sha256sum "$TEST_APK" | awk '{print $1}')
          # Extract aggregate test counts from androidTest result XMLs.
          TEST_COUNTS=$(python3 <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for ts in root.iter('testsuite'):
                  try:
                      tests += int(ts.get('tests', '0') or '0')
                      failures += int(ts.get('failures', '0') or '0')
                      errors += int(ts.get('errors', '0') or '0')
                      skipped += int(ts.get('skipped', '0') or '0')
                  except ValueError:
                      pass
          print(tests, failures, errors, skipped)
          PY
          )
          set -- $TEST_COUNTS
          TESTS=$1; FAILURES=$2; ERRORS=$3; SKIPPED=$4
          mkdir -p app/build
          {
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "APP_APK=$APP_APK"
            echo "APP_SHA256=$APP_SHA"
            echo "TEST_APK=$TEST_APK"
            echo "TEST_SHA256=$TEST_SHA"
            echo "EMULATOR_API=34"
            echo "EMULATOR_TARGET=default"
            echo "EMULATOR_ARCH=x86_64"
            echo "COMMAND=./gradlew :app:connectedDebugAndroidTest"
            echo "RESULT=${{ job.status }}"
            echo "TESTS=$TESTS"
            echo "FAILURES=$FAILURES"
            echo "ERRORS=$ERRORS"
            echo "SKIPPED=$SKIPPED"
          } > app/build/tested-apk-provenance.txt
          echo "=== tested-apk-provenance.txt ==="
          cat app/build/tested-apk-provenance.txt
          echo "=== sha256sum (both APKs) ==="
          sha256sum "$APP_APK" "$TEST_APK"
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 14
      - name: Upload tested APKs + provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-apk-provenance
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/tested-apk-provenance.txt
          if-no-files-found: error
          retention-days: 14
