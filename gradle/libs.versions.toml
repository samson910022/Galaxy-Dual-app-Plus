# Central version catalog for AGP / Kotlin / SDK levels.
[versions]
agp = "8.5.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
compileSdk = "34"
minSdk = "29"
targetSdk = "34"
shizuku = "13.1.5"
# Phase F2 (issue #6): observable app state needs coroutines + lifecycle.
# coroutines 1.9.0: first stable line with official Kotlin 2.0 support
# (matches kotlin 2.0.21); pure-Kotlin artifact, no compileSdk constraint.
# lifecycle 2.8.7: latest stable on the compileSdk 34 baseline (2.9.x moved
# to compileSdk 35); minSdk 21 < our minSdk 29. Verified on Google Maven.
# activity 1.9.2: stable from the same compileSdk 34 era (1.10.x moved to
# compileSdk 35); provides ComponentActivity + activity-ktx viewModels delegate.
coroutines = "1.9.0"
lifecycle = "2.8.7"
activity = "1.9.2"
# Phase P29 (issue #29): instrumentation harness (runner/androidTest).
# Versions pinned to the compileSdk 34 era (same policy as lifecycle/activity
# above): runner+core 1.6.1 / ext-junit 1.2.1 are the
# stable 34-baseline set (1.7.x moved to compileSdk 35).
# junit 4.13.2: same pinned artifact the unit tests already use (cached).
testRunner = "1.6.1"
testExtJunit = "1.2.1"
testCore = "1.6.1"
junit = "4.13.2"

[libraries]
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# Test-only dispatcher control (StandardTestDispatcher) for the deterministic
# DualViewModel tests. Same pinned version as the production coroutines above;
# production dependencies unchanged.
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
# Phase P29 (issue #29): androidTest harness only (production untouched).
# Runner drives ActivityScenario; ext-junit provides AndroidJUnit4;
# core provides ActivityScenario.
# (uiautomator intentionally not pulled: system back-press shares the same
# cancelRemove path already locked by CancelZeroWriteTest at VM level;
# device back-press stays in the manual matrix.)
test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
test-core = { group = "androidx.test", name = "core", version.ref = "testCore" }
junit-junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
